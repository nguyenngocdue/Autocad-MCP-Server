services:
  - type: web
    name: autocad-mcp-server
    runtime: node
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: node build/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MCP_TRANSPORT
        value: http
      # URL tới AutoCAD plugin (qua ngrok hoặc cloudflared)
      # Ví dụ: https://abc123.trycloudflare.com
      - key: AUTOCAD_HTTP_URL
        sync: false
      # (Tùy chọn) API key bảo mật — đặt giá trị bí mật
      - key: API_KEY
        sync: false
